<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login SIPANDA</title><link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"></head><body><main class="main" style="max-width:760px;margin:8vh auto;padding:24px"><article class="panel form-panel"><h1>Masuk ke SIPANDA</h1><p>Gunakan akun administrator atau petugas yang telah dibuat.</p>{% with messages = get_flashed_messages(with_categories=true) %}{% if messages %}{% for category, message in messages %}<div class="flash {{ category }}">{{ message }}</div>{% endfor %}{% endif %}{% endwith %}<form method="post" class="report-form"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Username<input type="text" name="username" autocomplete="username" required></label><label>Kata sandi<input type="password" name="password" autocomplete="current-password" required></label><button class="button primary" type="submit">Login</button></form></article></main></body></html>
